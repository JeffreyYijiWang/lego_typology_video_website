<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lego Mosaic Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    body, html { height:100%; margin:0; background:black; }
    #map { width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1) Initialize map in pixel-space
    const map = L.map('map', {
      crs: L.CRS.Simple,
      attributionControl: false,
      zoomSnap: 0.5,
      minZoom: -5
    });

    // 2) Load grid JSON
    fetch('grid_position.json')
      .then(r => r.json())
      .then(grid => {
        const { nx, ny } = grid.grid_size;
        const positions = grid.positions;
        const baseURL = 'https://jeffreyyijiwang.github.io/lego_typology_video_website/mapImages/';
        const cellSize = 500;  // each tile is 500×500 px

        // 3) Define full map bounds in pixels: width = nx*cellSize, height = ny*cellSize
        const fullBounds = [[0,0], [ny * cellSize, nx * cellSize]];
        map.setMaxBounds(fullBounds);
        map.fitBounds(fullBounds);

        // 4) Precompute each overlay’s pixel bounds
        const cells = Object.entries(positions).map(([fname, {col, row}]) => {
          const c0 = col - 1;
          // if row=1 is top row, invert Y here:
          const y0 = (ny - row) * cellSize;
          return {
            key: fname,
            url: baseURL + fname,
            bounds: [
              [y0,        c0 * cellSize],             // southWest (y, x)
              [y0 + cellSize, (c0 + 1) * cellSize]    // northEast
            ]
          };
        });

        const active = {};

        function update() {
          const view = map.getBounds();
          cells.forEach(cell => {
            const b = L.latLngBounds(cell.bounds);
            const inView = view.intersects(b);
            if (inView && !active[cell.key]) {
              active[cell.key] = L.imageOverlay(cell.url, cell.bounds).addTo(map);
            }
            if (!inView && active[cell.key]) {
              map.removeLayer(active[cell.key]);
              delete active[cell.key];
            }
          });
        }

        map.on('moveend zoomend', update);
        update();
      })
      .catch(console.error);
  </script>
</body>
</html>
