<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lego Mosaic Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin=""
  />
  <style>
    body, html { height:100%; margin:0; background:black; }
    #map { width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha512-o9+acezW+…(trimmed)…=="
    crossorigin=""
  ></script>
  <script>
  // 1) Initialize a simple CRS map whose bounds match your grid size
  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    zoomSnap: 0.5,
    attributionControl: false
  });

  // 2) Load your grid JSON
  fetch('grid_position.json')
    .then(r => r.json())
    .then(grid => {
      const { nx, ny } = grid.grid_size;
      const positions = grid.positions;
      const baseURL = 'https://jeffreyyijiwang.github.io/lego_typology_video_website/mapImages/';

      // 3) Define the map’s total bounds so [0,0] is bottom-left, [ny,nx] top-right
      const bounds = [[0,0], [ny, nx]];
      map.setMaxBounds(bounds);
      map.fitBounds(bounds);

      // 4) For each image, overlay it in the correct cell
      Object.entries(positions).forEach(([filename, {col, row}]) => {
        // col,row are 1-based. Convert to 0-based grid:
        const c0 = col - 1, r0 = row - 1;

        // Leaflet’s y‐axis grows **up**, so row=0 at bottom.
        // Our JSON row=1 at top? If your row=1 is top, invert:
        const y0 = ny - row;
        const y1 = ny - r0;

        // bounds = [[southWestY, southWestX], [northEastY, northEastX]]
        const imgBounds = [
          [y0, c0],
          [y1, c0 + 1]
        ];

        L.imageOverlay(baseURL + filename, imgBounds).addTo(map);
      });
    })
    .catch(console.error);
  </script>
</body>
</html>
