<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lego Gifs</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            position: absolute;
            object-fit: cover;
            pointer-events: none;
        }
    </style>
</head>
<body>
  <div id="container"></div>

  <script>
  // Load your grid JSON
  fetch('video_grid.json')
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById('container');
      const { positions, grid_size: { nx, ny } } = data;
      const W = window.innerWidth, H = window.innerHeight;
      const cellW = W / nx, cellH = H / ny;

      const baseURL = 'https://jeffreyyijiwang.github.io/lego_typology_video_website/video/';

      Object.entries(positions).forEach(([filename, { col, row }]) => {
        const video = document.createElement('video');
        video.src        = baseURL + filename;
        video.autoplay   = true;
        video.loop       = true;
        video.muted      = true;
        video.playsInline= true;

        // convert 1-based row/col into 0-based pixel offsets
        video.style.left   = `${(col - 1) * cellW}px`;
        video.style.top    = `${(row - 1) * cellH}px`;
        video.style.width  = `${cellW}px`;
        video.style.height = `${cellH}px`;

        container.appendChild(video);
      });
    })
    .catch(err => console.error('Error loading grid:', err));
  </script>
</body>
</html>
